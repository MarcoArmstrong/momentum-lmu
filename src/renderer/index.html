<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Electron</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />

    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body class="bg-gray-950 text-white">
    <div id="app" class="flex gap-4 p-4">
      <div class="sidebar bg-gray-900/90 backdrop-blur-sm p-4 rounded-lg border border-gray-700">
        <h1 class="text-3xl text-gray-200 mb-1">Momentum</h1>
        <p class="text-sm text-gray-200">Le Mans Ultimate overlay input telemetry</p>
      </div>

      <div
        class="space-y-4 bg-gray-900/90 backdrop-blur-sm p-4 rounded-lg border border-gray-700 w-2/3"
      >
        <h2 class="text-xl font-semibold mb-4">Connection Status</h2>

        <div class="space-y-3">
          <div>
            <div class="text-sm text-gray-400">Connection Status</div>
            <div id="status" class="text-sm font-semibold text-red-400">Disconnected</div>
          </div>

          <div>
            <div class="text-sm text-gray-400">Connection Method</div>
            <div id="method" class="text-sm font-semibold text-blue-400">None</div>
          </div>

          <div>
            <div class="text-sm text-gray-400">Debug Info</div>
            <div id="debug" class="text-xs text-gray-500 font-mono">Loading...</div>
          </div>
        </div>

        <div class="mt-4 p-3 bg-blue-900/50 rounded border border-blue-700">
          <p class="text-sm text-blue-200">Press F7 to unlock and move the telemetry window.</p>
        </div>
      </div>
    </div>

    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>

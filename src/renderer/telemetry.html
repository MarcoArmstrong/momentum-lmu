<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Momentum Telemetry</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />

    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body class="bg-transparent text-white" style="margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;">
    <div id="app" class="telemetry-container || p-2 rounded-md">
      <div class="bg-gray-900/75 border border-gray-400/20 rounded-md">

        <div class="h-[10px] w-full bg-gray-950/75 rounded-t-md"></div>

        <div class="flex justify-center items-center p-2">
        
          <div class="grid grid-cols-2 gap-3 hidden">
            <div class="bg-gray-900/80 p-2">
              <div class="text-xs text-gray-400">RPM</div>
              <div id="rpm" class="text-lg font-bold text-green-400">--</div>
            </div>
            
            <div class="bg-gray-900/80 p-2">
              <div class="text-xs text-gray-400">Max RPM</div>
              <div id="maxRpm" class="text-sm text-blue-400">--</div>
            </div>
            
            <div class="bg-gray-900/80 p-2">
              <div class="text-xs text-gray-400">Speed</div>
              <div id="speed" class="text-sm text-yellow-400">-- km/h</div>
            </div>
            
            <div class="bg-gray-900/80 p-2">
              <div class="text-xs text-gray-400">Gear</div>
              <div id="gear" class="text-sm text-purple-400">--</div>
            </div>
          </div>
          
          <!-- Pedal Graph -->
          <div class="flex gap-1">
            <canvas id="pedalsGraph" width="250" height="75" class="w-[250px] h-[75px] bg-gray-950/50 border border-gray-400/20 rounded-sm"></canvas>
            
            <div class="relative bg-gray-950/50 border border-gray-400/20 w-7 text-center flex flex-col items-center justify-between rounded-sm overflow-hidden">
              <div id="brake" class="absolute top-0 left-0 text-[12px] text-white w-full font-bold text-shadow-xs text-shadow-gray-900/100">0</div>
              <div class="flex flex-col items-center justify-end h-full w-full">
                <div id="brakeBar" class="w-full h-0 bg-brake" style="height: 0%"></div>
              </div>
            </div>

            <div class="relative bg-gray-950/50 border border-gray-400/20 w-7 text-center flex flex-col items-center justify-between rounded-sm overflow-hidden">
              <div id="throttle" class="absolute top-0 left-0 text-[12px] text-white w-full font-bold text-shadow-xs text-shadow-gray-900/100">0</div>
              <div class="flex flex-col items-center justify-end h-full w-full">
                <div id="throttleBar" class="w-full h-0 bg-throttle" style="height: 0%"></div>
              </div>
            </div>
          </div>
          
          <div class="mt-3 text-center hidden">
            <div id="status" class="text-xs font-semibold text-red-400">Disconnected</div>
          </div>
          
          <!-- Lock/Unlock indicator -->
          <div class="mt-2 text-center hidden">
            <div id="lockIndicator" class="text-xs text-gray-500">
              Press F7 to unlock and move window
            </div>
          </div>
        </div>

      </div>
      
      <!-- Draggable overlay - only active when unlocked -->
      <div id="dragZone" class="hidden absolute inset-0 -webkit-app-region-drag pointer-events-none"></div>
    </div>

    <script type="module" src="./src/telemetry.ts"></script>
  </body>
</html>
